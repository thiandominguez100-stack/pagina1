<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <input type="text" id="caja">
    <br>
    <br>
    <button onclick="pintarrojo()">ROJO</button>
    <button onclick="pintaramarillo()">AMARILLO</button>
    <button onclick="pintarverde()">VERDE</button>


    <script>
        function pintarrojo(){
            document.getElementById("caja").style.backgroundColor="#F00"
        }
        function pintaramarillo(){
            document.getElementById("caja").style.backgroundColor="#FFFF00"
        }
        function pintarverde(){
            document.getElementById("caja").style.backgroundColor="#0F0"
        }


    </script>
</body>
</html()
